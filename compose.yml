# Production Docker Compose for UmuriroReport
# Copy to the server (e.g. /opt/apps/umuriroreport/) with a restricted .env
#
# GHCR images (from this repository):
#   ghcr.io/niyonkuruwilson82/umuriroreport_project-frontend
#   ghcr.io/niyonkuruwilson82/umuriroreport_project-backend

services:

  database:
    image: mysql:8.4

    restart: unless-stopped

    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}

    volumes:
      - mysql_data:/var/lib/mysql
      # Place schema.sql next to compose.yml on the server (copied from repo root).
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro

    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    networks:
      - application


  backend:
    image: ghcr.io/niyonkuruwilson82/umuriroreport_project-backend:${IMAGE_TAG:-latest}

    restart: unless-stopped

    env_file:
      - .env

    environment:
      DB_HOST: database
      DB_PORT: 3306

    depends_on:
      database:
        condition: service_healthy

    ports:
      - "127.0.0.1:5000:5000"

    volumes:
      - uploads_data:/app/uploads

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s

    init: true

    security_opt:
      - no-new-privileges:true

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    networks:
      - application


  frontend:
    image: ghcr.io/niyonkuruwilson82/umuriroreport_project-frontend:${IMAGE_TAG:-latest}

    restart: unless-stopped

    depends_on:
      backend:
        condition: service_healthy

    ports:
      - "127.0.0.1:3000:80"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1/health >/dev/null 2>&1 || exit 1"
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

    security_opt:
      - no-new-privileges:true

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    networks:
      - application


volumes:
  mysql_data:
  uploads_data:


networks:
  application:
    driver: bridge
